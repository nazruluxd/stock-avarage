<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Stock Average Calculator</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-main);
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            margin-bottom: 12px;
            margin-top: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .result-box {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 20px;
            border-radius: 8px;
            margin-top: 24px;
            text-align: center;
        }

        .result-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .summary-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h1>Stock Cost Calculator</h1>

    <!-- Step 1: Current Position -->
    <div class="section-title">Step 1: What you own now</div>
    <div class="input-group">
        <div>
            <label for="current-shares">Shares</label>
            <input type="number" id="current-shares" placeholder="e.g. 13" min="0" oninput="calculateAverage()">
        </div>
        <div>
            <label for="current-price">Price Paid ($)</label>
            <input type="number" id="current-price" placeholder="e.g. 10.00" min="0" step="any" oninput="calculateAverage()">
        </div>
    </div>

    <!-- Step 2: New Position -->
    <div class="section-title">Step 2: What you want to buy</div>
    <div class="input-group">
        <div>
            <label for="new-shares">New Shares</label>
            <input type="number" id="new-shares" placeholder="e.g. 100" min="0" oninput="calculateAverage()">
        </div>
        <div>
            <label for="new-price">New Price ($)</label>
            <input type="number" id="new-price" placeholder="e.g. 2.90" min="0" step="any" oninput="calculateAverage()">
        </div>
    </div>

    <!-- Results Overview -->
    <div class="result-box">
        <div class="result-label">Your New Average Price</div>
        <div class="result-value" id="avg-price">$0.00</div>
        
        <div class="summary-details">
            <div>Total Shares: <strong id="total-shares">0</strong></div>
            <div>Total Cost: <strong id="total-cost">$0.00</strong></div>
        </div>
    </div>
</div>

<script>
function calculateAverage() {
    // Get values from input boxes
    const currentShares = parseFloat(document.getElementById('current-shares').value) || 0;
    const currentPrice = parseFloat(document.getElementById('current-price').value) || 0;
    const newShares = parseFloat(document.getElementById('new-shares').value) || 0;
    const newPrice = parseFloat(document.getElementById('new-price').value) || 0;

    // Run the math formulas
    const currentCost = currentShares * currentPrice;
    const newCost = newShares * newPrice;
    
    const totalShares = currentShares + newShares;
    const totalCost = currentCost + newCost;
    
    let averagePrice = 0;
    if (totalShares > 0) {
        averagePrice = totalCost / totalShares;
    }

    // Display updates on screen
    document.getElementById('avg-price').innerText = '$' + averagePrice.toFixed(2);
    document.getElementById('total-shares').innerText = totalShares;
    document.getElementById('total-cost').innerText = '$' + totalCost.toFixed(2);
}
</script>

</body>
</html>
